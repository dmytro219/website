<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1117; --panel: #181c25; --text: #f4f6fb; --muted: #a8afbf; --accent: #ff4d67; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    .container { width: min(1120px, calc(100% - 32px)); margin: auto; }
    header { padding: 72px 0 44px; text-align: center; }
    h1 { margin: 0 0 10px; font-size: clamp(2.2rem, 6vw, 4.5rem); letter-spacing: -.05em; }
    header p { margin: 0; color: var(--muted); }
    .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; padding-bottom: 64px; }
    .card { overflow: hidden; background: var(--panel); border: 1px solid #272d3a; border-radius: 14px; box-shadow: 0 10px 30px #0003; }
    .embed { aspect-ratio: 16 / 9; background: #090a0d; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .details { padding: 18px 20px 20px; }
    h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .details p { margin: 0; color: var(--muted); }
    footer { padding: 24px 0 40px; color: var(--muted); text-align: center; font-size: .9rem; }
  </style>
</head>
<body>
  <header class="container">
    <h1>Videos</h1>
    <p>A collection of videos worth watching.</p>
  </header>

  <main class="container videos">
    <!-- Replace each YouTube ID in src with the video you want to feature. -->
    <article class="card">
      <div class="embed">
        <iframe src="https://www.youtube.com/embed/VIDEO_ID_1" title="Video 1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <div class="details"><h2>Video title</h2><p>Add a short description here.</p></div>
    </article>

    <article class="card">
      <div class="embed">
        <iframe src="https://www.youtube.com/embed/VIDEO_ID_2" title="Video 2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <div class="details"><h2>Video title</h2><p>Add a short description here.</p></div>
    </article>

    <article class="card">
      <div class="embed">
        <iframe src="https://www.youtube.com/embed/VIDEO_ID_3" title="Video 3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <div class="details"><h2>Video title</h2><p>Add a short description here.</p></div>
    </article>
  </main>
</body>
</html>
